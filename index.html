<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Pitthugram</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .portal-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .portal-glow {
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 700px;
            background: radial-gradient(ellipse, rgba(244,0,9,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .tab-switcher {
            display: flex;
            background: var(--bg-surface, #161616);
            border: 1px solid var(--border, #2A2A2A);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 1.25rem;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary, #a0a0a0);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--primary, #F40009);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="portal-page">
    <div class="portal-glow"></div>

    <div class="login-card" style="position:relative;z-index:1;max-width:440px;width:100%;">
        <a href="./index.html" class="login-logo">
            <img src="./logo.png" alt="Pitthugram">
        </a>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabSignIn" onclick="switchPortalTab('signin')">Sign In</button>
            <button class="tab-btn" id="tabTrial" onclick="switchPortalTab('trial')">Request Free Trial</button>
        </div>

        <div class="alert-box" id="alertBox">
            <i class="ph-fill ph-warning-circle"></i>
            <span id="alertMsg"></span>
        </div>

        <!-- 1. SIGN IN FORM -->
        <div id="signInSection">
            <div class="login-head" style="margin-bottom:1.25rem;">
                <h1>Welcome Back</h1>
                <p>Sign in to your teacher / owner portal</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="ph ph-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="ph ph-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pw" id="togglePw">
                            <i class="ph ph-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Sign In</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
                <div id="loginSpinner" style="display:none;width:24px;height:24px;border:2px solid rgba(244,0,9,0.25);border-top-color:#f40009;border-radius:50%;animation:spin 0.7s linear infinite;margin:.75rem auto 0;"></div>
            </form>
        </div>

        <!-- 2. DIRECT HUBSPOT TRIAL REGISTRATION FORM -->
        <div id="trialSection" style="display:none;">
            <div class="login-head" style="margin-bottom:1.25rem;">
                <h1>Start Free Trial</h1>
                <p>Experience automated quizzing &amp; LMS for your coaching institute</p>
            </div>

            <form id="trialForm" class="login-form">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
                    <div class="form-group">
                        <label for="tFirstname">First Name</label>
                        <div class="input-wrap">
                            <input type="text" id="tFirstname" placeholder="Vikram" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="tLastname">Last Name</label>
                        <div class="input-wrap">
                            <input type="text" id="tLastname" placeholder="Aditya">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tEmail">Work Email Address</label>
                    <div class="input-wrap">
                        <i class="ph ph-envelope input-icon"></i>
                        <input type="email" id="tEmail" placeholder="director@academy.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tPhone">WhatsApp / Mobile Number</label>
                    <div class="input-wrap">
                        <i class="ph ph-phone input-icon"></i>
                        <input type="tel" id="tPhone" placeholder="+91 98765 43210" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tCompany">Coaching / Institute Name</label>
                    <div class="input-wrap">
                        <i class="ph ph-buildings input-icon"></i>
                        <input type="text" id="tCompany" placeholder="Apex IIT-JEE Academy" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tExam">Target Exam</label>
                    <div class="input-wrap">
                        <select id="tExam" style="width:100%;padding:0.65rem 0.85rem;background:var(--bg-input,#1a1a1a);border:1.5px solid var(--border,#2a2a2a);border-radius:var(--radius-md);color:var(--text-primary);font-family:inherit;">
                            <option value="JEE">JEE (Mains &amp; Advanced)</option>
                            <option value="NEET">NEET Medical</option>
                            <option value="CBSE">CBSE Class 9-12</option>
                            <option value="Foundation">Foundation Math &amp; Science</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="trialBtn" style="background:var(--primary,#f40009);color:#fff;">
                    <span>Submit &amp; Get Trial Access</span>
                    <i class="ph ph-rocket-launch"></i>
                </button>
                <div id="trialSpinner" style="display:none;width:24px;height:24px;border:2px solid rgba(244,0,9,0.25);border-top-color:#f40009;border-radius:50%;animation:spin 0.7s linear infinite;margin:.75rem auto 0;"></div>
            </form>
        </div>

        <div class="login-footer-note">
            Need help? <a href="mailto:support@pitthugram.com">Contact Pitthugram Support</a>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://lekvzyoarawotlsbeoqa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxla3Z6eW9hcmF3b3Rsc2Jlb3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTgzNTIsImV4cCI6MjA5Mzg3NDM1Mn0.KO-UyQerUdbxxhqBDX5F51ZMU2WGIi6BLg-b-rDALmk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const existingToken = localStorage.getItem('pg_access_token');
const existingRole  = localStorage.getItem('pg_role');
if (existingToken) {
    window.location.href = existingRole === 'owner' ? 'owner-dashboard.html' : 'quiz-builder.html';
}

function switchPortalTab(tab) {
    const sSection = document.getElementById('signInSection');
    const tSection = document.getElementById('trialSection');
    const sBtn = document.getElementById('tabSignIn');
    const tBtn = document.getElementById('tabTrial');
    document.getElementById('alertBox').className = 'alert-box';

    if (tab === 'signin') {
        sSection.style.display = 'block';
        tSection.style.display = 'none';
        sBtn.className = 'tab-btn active';
        tBtn.className = 'tab-btn';
    } else {
        sSection.style.display = 'none';
        tSection.style.display = 'block';
        tBtn.className = 'tab-btn active';
        sBtn.className = 'tab-btn';
    }
}

document.getElementById('togglePw').addEventListener('click', function() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'ph ph-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'ph ph-eye';
    }
});

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className = 'alert-box alert-' + type;
    document.getElementById('alertMsg').textContent = msg;
}

// 1. Sign in handler
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    document.getElementById('alertBox').className = 'alert-box';
    document.getElementById('loginBtn').style.display  = 'none';
    document.getElementById('loginSpinner').style.display = 'block';

    try {
        const { data: authData, error: authErr } = await sb.auth.signInWithPassword({ email, password });
        if (authErr) throw new Error(authErr.message || 'Invalid email or password.');

        const { data: profiles, error: profErr } = await sb.from('profiles').select('role').eq('id', authData.user.id).single();
        if (profErr) throw new Error('Account not configured. Please contact support.');

        const role = profiles?.role;
        if (!role) throw new Error('Account not configured. Please contact support.');
        if (role !== 'owner' && role !== 'teacher') throw new Error('Unrecognised account role. Please contact support.');

        localStorage.setItem('pg_access_token',  authData.session.access_token);
        localStorage.setItem('pg_refresh_token', authData.session.refresh_token);
        localStorage.setItem('pg_user',          JSON.stringify({ id: authData.user.id, email: authData.user.email }));
        localStorage.setItem('pg_role',          role);

        document.getElementById('loginSpinner').style.display = 'none';
        showAlert('Login successful! Redirecting...', 'success');

        setTimeout(() => {
            window.location.href = role === 'owner' ? 'owner-dashboard.html' : 'quiz-builder.html';
        }, 800);

    } catch (err) {
        document.getElementById('loginSpinner').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'flex';
        showAlert(err.message || 'Something went wrong. Please try again.', 'error');
    }
});

// 2. Direct HubSpot Trial Registration handler
document.getElementById('trialForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const firstname   = document.getElementById('tFirstname').value.trim();
    const lastname    = document.getElementById('tLastname').value.trim();
    const email       = document.getElementById('tEmail').value.trim();
    const phone       = document.getElementById('tPhone').value.trim();
    const company     = document.getElementById('tCompany').value.trim();
    const exam_target = document.getElementById('tExam').value;

    document.getElementById('alertBox').className = 'alert-box';
    document.getElementById('trialBtn').style.display  = 'none';
    document.getElementById('trialSpinner').style.display = 'block';

    const HS_TOKEN = atob('cGF0LW5hMi1iNGE4MjY0YS0xZDJlLTRlNzEtOWMxOC1jMjQwZWYyYmFmYzc=');
    const hsHeaders = {
        'Authorization': 'Bearer ' + HS_TOKEN,
        'Content-Type': 'application/json'
    };

    try {
        // 1. Create Contact in HubSpot
        const contactResp = await fetch('https://api.hubapi.com/crm/v3/objects/contacts', {
            method: 'POST',
            headers: hsHeaders,
            body: JSON.stringify({
                properties: {
                    email: email,
                    firstname: firstname,
                    lastname: lastname,
                    phone: phone,
                    company: company
                }
            })
        });
        const contactData = await contactResp.json();
        const contactId = contactData.id;

        // 2. Create Company & Link in HubSpot
        if (company && contactId) {
            try {
                const compResp = await fetch('https://api.hubapi.com/crm/v3/objects/companies', {
                    method: 'POST',
                    headers: hsHeaders,
                    body: JSON.stringify({
                        properties: { name: company, country: 'India' }
                    })
                });
                const compData = await compResp.json();
                if (compData.id) {
                    await fetch('https://api.hubapi.com/crm/v4/objects/contacts/' + contactId + '/associations/default/companies/' + compData.id, {
                        method: 'PUT',
                        headers: hsHeaders
                    });
                }
            } catch(e) { console.warn('Company link notice:', e); }
        }

        // 3. Create Follow-up Task in HubSpot
        try {
            await fetch('https://api.hubapi.com/crm/v3/objects/tasks', {
                method: 'POST',
                headers: hsHeaders,
                body: JSON.stringify({
                    properties: {
                        hs_task_subject: 'New Trial Request: ' + firstname + ' ' + lastname + ' (' + (company || 'Educator') + ')',
                        hs_task_body: 'Target Exam: ' + exam_target + ' | Phone: ' + phone + ' | Email: ' + email + '. Follow up to setup Moodle trial LMS.',
                        hs_task_status: 'NOT_STARTED',
                        hs_task_priority: 'HIGH',
                        hs_timestamp: String(Date.now())
                    }
                })
            });
        } catch(e) { console.warn('Task notice:', e); }

        // 4. Trigger AiSensy WhatsApp Cloud API (Free Plan Template)
        try {
            const rawPhone = phone.replace(/[^0-9]/g, '');
            const cleanPhone = rawPhone.length === 10 ? '91' + rawPhone : rawPhone;
            const aisensyKey = atob('ZXlKaGJHY2lPaUpJVXpJMk5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBaQ0k2SWpaaE5XSTRaak01TVRsaFpXTXlNREl5WVRZMmREVXlOQ0lzSW01aGJXVWlPaUpRYVhSMGFIVm5jbUZ0SURFeE16WWlMQ0poY0hCd1ptVnVaVzFwYldVbk9pSkJhVk5sYm5ONUlpd2lZMnhwWlc1MElVUWlPaUptWVRWaU9HWmpZemt4T1dGbFl6SXdNampoTmpaa05UQTFJaXdpWVdOMGFYWmxVR3hoYmlJNklrWlNSVlZmUms5U1JWWlZVaUlzSW1saGRDSTZNVGM0T0RBMk5EY3lPWHAuTTNSU1AzM1dnaEhaUE1CdTFSUGxGYXM3Ym83YlE0Vm9WTGFuXzJLTWE3TQ==');

            fetch('https://backend.aisensy.com/campaign/t1/api/v2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    apiKey: aisensyKey,
                    campaignName: 'pitthugram_welcome',
                    destination: cleanPhone,
                    userName: firstname + (lastname ? ' ' + lastname : ''),
                    templateParams: [
                        firstname,
                        company || 'Coaching Institute',
                        'https://portal.classes.institute'
                    ]
                })
            }).catch(function(e) { console.warn('AiSensy notice:', e); });
        } catch(e) { console.warn('AiSensy dispatch notice:', e); }

        document.getElementById('trialSpinner').style.display = 'none';
        showAlert('🎉 Thank you! Your trial account is registered in HubSpot CRM. Our onboarding team will connect on WhatsApp (' + phone + ').', 'success');
        document.getElementById('trialForm').reset();
        document.getElementById('trialBtn').style.display = 'flex';
    } catch(err) {
        document.getElementById('trialSpinner').style.display = 'none';
        document.getElementById('trialBtn').style.display = 'flex';
        showAlert(err.message || 'Error submitting request. Please try again.', 'error');
    }
});
</script>
</body>
</html>
