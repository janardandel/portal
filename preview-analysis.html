<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student & Batch Analysis Preview ? Pitthugram</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --bg-card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --line: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
        --bg-card: #1e293b;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14.5px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 0.9rem;
    }
    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .report-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.88rem;
    }
    .report-table th {
      text-align: left;
      padding: 9px 12px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .report-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }
    .report-table tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Class Performance &amp; Student Analysis ? Live Preview</h1>
    <p class="sub">Demonstrating whole class diagnostics, topic error heatmaps, and individual student drill-down via Roll Number &amp; Name selector.</p>
  </header>
  <div id="analysisPanel"></div>
</main>

<script src="demo-analysis-data.js"></script>
<script src="analysis.js"></script>
<script>
  if (window.PGAnalysis && window.PG_DEMO_ANALYSIS) {
    var builtData = window.PGAnalysis.build(window.PG_DEMO_ANALYSIS);
    window.PGAnalysis.render(document.getElementById('analysisPanel'), builtData, { demo: true });
  } else {
    document.getElementById('analysisPanel').innerHTML = '<p style="color:red">Failed to load analysis engine or demo data.</p>';
  }
</script>
</body>
</html>
