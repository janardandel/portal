  <style>
    /* -- Desktop sidebar (1024px+) -- */
    @media (min-width: 1024px) {
      #qbSidebar {
        display: flex !important;
        flex-direction: column !important;
        position: fixed !important;
        top: 72px !important;
        left: 0 !important;
        width: 280px !important;
        height: calc(100vh - 72px) !important;
        max-height: none !important;
        border-radius: 0 !important;
        transform: none !important;
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 50 !important;
      }
      #qbPage.qb-page { margin-left: 280px !important; }
      #qbPage .qb-layout { display: block !important; }
      #sidebarToggle { display: none !important; }
      #sidebarBackdrop { display: none !important; }
      #sidebarClose { display: none !important; }
    }

    /* -- Tablet, iPad & Mobile Sidebar Drawer (<1024px) -- */
    @media (max-width: 1023px) {
      #sidebarToggle { display: inline-flex !important; }
      #qbPage.qb-page { margin-left: 0 !important; padding: 1.25rem 1.25rem max(4rem, env(safe-area-inset-bottom)) !important; }
      #qbSidebar {
        position: fixed !important;
        inset: 0 auto 0 0 !important;
        width: min(320px, 86vw) !important;
        height: 100vh !important;
        max-height: 100vh !important;
        transform: translateX(-100%) !important;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        z-index: 300 !important;
        box-shadow: var(--shadow-xl) !important;
      }
      #qbSidebar.open {
        transform: translateX(0) !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      #sidebarBackdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 290;
      }
      #sidebarBackdrop.show { display: block !important; }
      #sidebarClose { display: inline-flex !important; }
    }

    /* -- Mobile (<768px) -- */
    @media (max-width: 768px) {
      #qbPage.qb-page { padding: 1rem 0.85rem max(4rem, env(safe-area-inset-bottom)) !important; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.75rem !important; }
      .kpi-card { padding: 0.9rem 0.85rem !important; }
      .kpi-value { font-size: 1.45rem !important; }
      .nav-extra-btn { display: none !important; }
    }

    /* -- Foldable Cover Screen (<380px) -- */
    @media (max-width: 380px) {
      #qbPage.qb-page { padding: 0.75rem 0.5rem max(4rem, env(safe-area-inset-bottom)) !important; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.5rem !important; }
      .kpi-card { padding: 0.65rem 0.5rem !important; }
      .kpi-value { font-size: 1.2rem !important; }
      .kpi-label { font-size: 0.7rem !important; }
      .report-table th, .report-table td { padding: 0.65rem 0.5rem !important; font-size: 0.78rem !important; }
    }

    /* -- Test Card Directory inside Sidebar -- */
    .test-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    .test-card:hover {
      border-color: var(--primary);
      background: rgba(244,0,9,0.06);
    }
    .test-card.active {
      border-color: var(--primary);
      background: rgba(244,0,9,0.12);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .test-card-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .test-card-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* -- KPI Grid -- */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.35rem;
    }
    .kpi-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .kpi-sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 0.35rem;
    }

    /* -- Leaderboard Table -- */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      margin-top: 1rem;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
      white-space: nowrap;
    }
    .report-table th {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.85rem 1.15rem;
      border-bottom: 1px solid var(--border);
    }
    .report-table td {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      color: var(--text-secondary);
    }
    .report-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }
    .report-table tr:last-child td { border-bottom: none; }

    /* -- Badges -- */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
    }
    .status-badge.approved   { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-badge.draft      { background: rgba(234,179,8,0.15);  color: #eab308; }
    .status-badge.failed     { background: rgba(239,68,68,0.15);  color: #ef4444; }

    .rank-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      font-size: 0.8rem;
    }
    .rank-1 { background: rgba(234,179,8,0.22); color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
    .rank-2 { background: rgba(148,163,184,0.22); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.4); }
    .rank-3 { background: rgba(217,119,6,0.22); color: #f59e0b; border: 1px solid rgba(217,119,6,0.4); }
    .rank-other { color: var(--text-secondary); font-weight: 600; padding: 0.2rem 0.5rem; }

    .empty-report {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      text-align: center;
      color: var(--text-secondary);
      gap: 0.75rem;
      padding: 3rem 1.5rem;
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }
    .empty-report i { font-size: 3rem; color: var(--border-light); }

    .spinner { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

<script>
let allTests = [];
let activeQuizId = null;
let activeQuizTitle = '';

function checkAuth() {
  const token = localStorage.getItem('pg_access_token');
  const user  = localStorage.getItem('pg_user');
  if (!token || !user) {
    location.replace('index.html');
    return false;
  }
  return true;
}

function logout() {
  ['pg_access_token','pg_refresh_token','pg_user','pg_role'].forEach(k=>localStorage.removeItem(k));
  window.location.href = './index.html';
}

function openSidebar() {
  const sb = document.getElementById('qbSidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (sb) sb.classList.add('open');
  if (bd) bd.classList.add('show');
  document.body.style.overflow = 'hidden';
}


function buildWhatsAppReportUrl(student, quizName, tenantName) {
  if (student && student.whatsapp_url && typeof student.whatsapp_url === 'string') {
    const raw = student.whatsapp_url.trim();
    if (raw.startsWith(' || raw.startsWith(' {
      return raw;
    }
  }

  const sName = (student && (student.student_name || student.name)) || 'Student';
  const roll = (student && student.roll_number) ? ` (Roll: ${student.roll_number})` : '';
  const score = (student && student.score != null) ? student.score : 0;
  const maxScore = (student && student.max_score != null) ? student.max_score : 120;
  const pct = (student && student.percentage != null) ? student.percentage : Math.round((score / (maxScore || 1)) * 100);
  const rank = (student && student.rank) ? `#${student.rank}` : 'Participated';
  const timeTaken = (student && student.time_taken_formatted) ? `⏱ Time Taken: ${student.time_taken_formatted}\n` : '';
  const institute = tenantName || 'Classes Institute';
  const testTitle = quizName || 'Assessment Test';
  const dateStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

  const msg = 
`📊 *${institute}*
📝 *Student Report Card — ${testTitle}*
📅 Date: ${dateStr}

👤 *Student:* ${sName}${roll}
🏆 *Rank:* ${rank}
🎯 *Score:* ${score} / ${maxScore}
📈 *Accuracy:* ${pct}%
${timeTaken}
💡 *Teacher Feedback:* Good attempt! Keep practicing your weak topics to improve accuracy.

_Sent via ${institute} Portal_`;

  let phoneDigits = '';
  if (student && student.phone) {
    phoneDigits = String(student.phone).replace(/[^0-9]/g, '');
    if (phoneDigits.length === 10) phoneDigits = '91' + phoneDigits;
  }

  if (phoneDigits && phoneDigits.length >= 10) {
    return `https://wa.me/${phoneDigits}?text=${encodeURIComponent(msg)}`;
  }
  return `https://wa.me/?text=${encodeURIComponent(msg)}`;
}

function closeSidebar() {
  const sb = document.getElementById('qbSidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('show');
  document.body.style.overflow = '';
}

function getTenantMoodleUrl() {
  return sessionStorage.getItem('pg_moodle_url') || localStorage.getItem('pg_moodle_url') || 'https://lms.pitthugram.com';
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

  {
    id: 'demo-test-1',
    quiz_title: 'JEE Advanced Grand Mock Test 01',
    moodle_quiz_id: '101',

    moodle_quiz_id: '102',
    created_at: new Date(Date.now() - 86400000).toISOString(),

  allTests = SAMPLE_DEMO_TESTS;

async function loadTestsDirectory() {
  const listEl = document.getElementById('testsListContainer');
  if (!listEl) return;

  const isDemo = new URLSearchParams(location.search).get('demo') === '1';
  if (isDemo && window.PG_DEMO_ANALYSIS) {
    loadSampleDemoTest();
    return;
  }

  listEl.innerHTML = '<p style="color:var(--text-secondary);font-size:0.8rem;text-align:center;padding:1rem 0;"><i class="ph ph-spinner-gap spinner"></i> Loading tests...</p>';

  try {
    const res = await fetch(' + encodeURIComponent((function(){ try { var m = JSON.parse(localStorage.getItem('pg_memberships') || '[]').find(function(x){ return x.role === 'owner' || x.role === 'teacher'; }); return m ? m.institute_id : ''; } catch (e) { return ''; } })()), { headers: { Authorization: 'Bearer ' + (localStorage.getItem('pg_access_token') || '') } });
    const list = await res.json();

    if (!list || !list.length) {
      // Graceful fallback: If no live scheduled assessments in institute database yet,
      // load the sample demo tests with an explanatory banner so the user never sees an empty screen.
      allTests = SAMPLE_DEMO_TESTS;
      renderTestsList(allTests);
      const note = document.createElement('div');
      note.style.cssText = 'padding:0.45rem 0.65rem;margin-bottom:0.6rem;background:rgba(244,0,9,0.08);border:1px dashed rgba(244,0,9,0.3);border-radius:var(--radius);font-size:0.75rem;color:var(--text-secondary);';
      note.innerHTML = '<strong style="color:var(--primary);">Sample Tests:</strong> No live database tests found yet for your institute. Showing sample cohort data below.';
      listEl.insertBefore(note, listEl.firstChild);
      selectTest('101', allTests[0].quiz_title);
      return;
    }

    allTests = list;
    renderTestsList(allTests);

    const firstTest = allTests[0];
    if (firstTest) {
      let qid = '';
      if (firstTest.moodle_quiz_id) {
        const m = firstTest.moodle_quiz_id.match(/[?&]id=(\d+)/);
        if (m) qid = m[1];
        else if (/^\d+$/.test(firstTest.moodle_quiz_id)) qid = firstTest.moodle_quiz_id;
      }
      selectTest(qid || '13', firstTest.quiz_title || 'Recent Test');
    }
  } catch(e) {
    // On fetch error (e.g. offline/network), show sample tests so interface remains fully functional
    allTests = SAMPLE_DEMO_TESTS;
    renderTestsList(allTests);
    selectTest('101', allTests[0].quiz_title);
  }
}

function renderTestsList(items) {
  const listEl = document.getElementById('testsListContainer');
  if (!items.length) {
    listEl.innerHTML = '<p style="color:var(--text-secondary);font-size:0.8rem;padding:1rem;text-align:center;">No matching tests.</p>';
    return;
  }

  listEl.innerHTML = items.map(q => {
    let qid = '';
    if (q.moodle_quiz_id) {
      const m = q.moodle_quiz_id.match(/[?&]id=(\d+)/);
      if (m) qid = m[1];
      else if (/^\d+$/.test(q.moodle_quiz_id)) qid = q.moodle_quiz_id;
    }
    const targetQuizId = qid || '13';
    const isActive = activeQuizId === targetQuizId;
    const qCount = (q.question_ids && Array.isArray(q.question_ids)) ? q.question_ids.length : 1;
    const dateStr = q.scheduled_date || 'Recent';

    return `
      <div class="test-card ${isActive ? 'active' : ''}" onclick="selectTest('${targetQuizId}', '${escHtml(q.quiz_title || 'Quiz').replace(/'/g, "\\'")}')">
        <div class="test-card-title">${escHtml(q.quiz_title || 'Scheduled Quiz')}</div>
        <div class="test-card-meta">
          <span><i class="ph ph-graduation-cap"></i> Class ${escHtml(q.class || '11')}</span>
          <span><i class="ph ph-list-checks"></i> ${qCount} Qs</span>
          <span><i class="ph ph-calendar"></i> ${dateStr}</span>
        </div>
      </div>
    `;
  }).join('');
}

function filterTestList() {
  const q = (document.getElementById('testSearchInput').value || '').toLowerCase();
  const filtered = allTests.filter(t => (t.quiz_title || '').toLowerCase().includes(q) || (t.class || '').toLowerCase().includes(q));
  renderTestsList(filtered);
}

async function selectTest(quizId, quizTitle) {
  activeQuizId = quizId;
  activeQuizTitle = quizTitle;
  renderTestsList(allTests);
  closeSidebar(); // On mobile, close drawer upon selection

  document.getElementById('emptyReportState').style.display = 'none';
  document.getElementById('kpiContainer').style.display = 'grid';
  document.getElementById('resultsContent').style.display = 'block';
  document.getElementById('btnRefreshReport').style.display = 'inline-flex';
  document.getElementById('btnPrintReport').style.display = 'inline-flex';

  document.getElementById('repQuizTitle').innerHTML = `<i class="ph-fill ph-chart-line-up" style="color:var(--primary);"></i> ${escHtml(quizTitle)}`;
  document.getElementById('repQuizSubtitle').innerHTML = '<span><i class="ph ph-spinner-gap spinner"></i> Querying student test attempts & analytics...</span>';

  document.getElementById('kpiAttempts').textContent = '...';
  document.getElementById('kpiParticipation').textContent = 'Enrolled: ...';
  document.getElementById('kpiAvgScore').textContent = '...';
  document.getElementById('kpiAvgPct').textContent = 'Accuracy: ...';
  document.getElementById('kpiHighest').textContent = '...';
  document.getElementById('kpiLowest').textContent = 'Lowest: ...';
  document.getElementById('kpiQuestions').textContent = '...';
  document.getElementById('kpiMaxScore').textContent = 'Max Score: ...';
  document.getElementById('leaderboardSummary').textContent = '';

  const tbody = document.getElementById('studentTableBody');
  tbody.innerHTML = `<tr><td colspan="7" style="padding:2.5rem;text-align:center;color:var(--text-secondary);"><i class="ph ph-spinner-gap spinner" style="font-size:1.8rem;margin-bottom:0.5rem;display:block;"></i> Fetching student scores & leaderboard...</td></tr>`;

  try {
    const instituteId = sessionStorage.getItem('pg_institute_id') || localStorage.getItem('pg_institute_id') || '65e4628a-a283-45a3-ab2d-84073977d4c4';
    const tenantName = sessionStorage.getItem('pg_institute_name') || localStorage.getItem('pg_institute_name') || 'Classes Institute';
    const moodleUrl = getTenantMoodleUrl();

    const reportUrl = `
    
    let data;
    const isSampleTest = (allTests.find(t => (t.moodle_quiz_id === quizId || t.id === quizId)) || {}).is_sample;
    if ((new URLSearchParams(location.search).get('demo') === '1' || isSampleTest) && window.PG_DEMO_ANALYSIS) {
      data = {
        quiz_name: quizTitle || window.PG_DEMO_ANALYSIS.quiz_title || 'JEE Advanced Grand Mock Test 01',
        course_name: window.PG_DEMO_ANALYSIS.course_name || 'JEE Masterclass 2026',
        question_count: (window.PG_DEMO_ANALYSIS.questions || []).length,
        timelimit: 3600,
        max_score: 120,
        analytics: {
          total_attempts: 8,
          total_enrolled: 8,
          participation_rate: 100,
          average_score: 97.1,
          average_percentage: 80.9,
          highest_score: 120,
          lowest_score: 64
        },
        leaderboard: (window.PG_DEMO_ANALYSIS.students || []).map((s, idx) => {
          const score = 120 - idx * 8;
          const maxScore = 120;
          const pct = Math.round(((120 - idx * 8) / 120) * 1000) / 10;
          const phone = '91987654321' + idx;
          const dummyStudent = {
            rank: idx + 1,
            student_name: s.student_name,
            name: s.student_name,
            roll_number: s.roll_number,
            email: `${(s.roll_number || 'stu').toLowerCase()}@pitthugram.com`,
            phone: phone,
            score: score,
            max_score: maxScore,
            percentage: pct,
            time_taken_formatted: `${35 + idx * 2}m 10s`,
            submitted_at: Date.now() - (idx * 3600 * 1000),
            status: 'Finished'
          };
          dummyStudent.whatsapp_url = buildWhatsAppReportUrl(dummyStudent, quizTitle || 'JEE Advanced Grand Mock Test 01', tenantName);
          return dummyStudent;
        }),
        questions: window.PG_DEMO_ANALYSIS.questions,
        question_results: window.PG_DEMO_ANALYSIS.question_results
      };
    } else {
      const res = await fetch(reportUrl);
      data = await res.json();
    }

    if (!data || data.status === 'error') {
      document.getElementById('repQuizSubtitle').innerHTML = `<span style="color:var(--primary);"><i class="ph ph-warning-circle"></i> ${escHtml(data?.message || 'Report unavailable')}</span>`;
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:var(--primary);"><i class="ph ph-warning-circle" style="font-size:1.5rem;margin-bottom:0.4rem;display:block;"></i> ${escHtml(data?.message || 'No attempt data found')}</td></tr>`;
      return;
    }

    if (data.quiz_name) {
      document.getElementById('repQuizTitle').innerHTML = `<i class="ph-fill ph-chart-line-up" style="color:var(--primary);"></i> ${escHtml(data.quiz_name)}`;
    }
    document.getElementById('repQuizSubtitle').innerHTML = `
      <span><i class="ph ph-book-open"></i> ${escHtml(data.course_name || 'Class Course')}</span>
      <span><i class="ph ph-list-numbers"></i> ${data.question_count || 0} Questions</span>
      <span><i class="ph ph-timer"></i> ${Math.round((data.timelimit || 0) / 60)} min limit</span>
    `;

    const a = data.analytics || {};
    document.getElementById('kpiAttempts').textContent = a.total_attempts ?? 0;
    document.getElementById('kpiParticipation').textContent = `Participation: ${a.participation_rate ?? 0}% (${a.total_attempts}/${a.total_enrolled || a.total_attempts})`;
    document.getElementById('kpiAvgScore').textContent = `${a.average_score ?? 0} / ${data.max_score ?? 0}`;
    document.getElementById('kpiAvgPct').textContent = `Cohort Accuracy: ${a.average_percentage ?? 0}%`;
    document.getElementById('kpiHighest').textContent = `${a.highest_score ?? 0} / ${data.max_score ?? 0}`;
    document.getElementById('kpiLowest').textContent = `Lowest Score: ${a.lowest_score ?? 0}`;
    document.getElementById('kpiQuestions').textContent = data.question_count ?? 0;
    document.getElementById('kpiMaxScore').textContent = `Max Possible: ${data.max_score ?? 0} pts`;

    const list = data.leaderboard || [];
    document.getElementById('leaderboardSummary').textContent = `${list.length} student submission(s)`;

    // Question-level analysis: webhook data if present, else same-origin /api/question-analysis,
    // or sample/demo analysis data
    (async function () {
      var panel = document.getElementById('analysisPanel');
      var demo = (new URLSearchParams(location.search).get('demo') === '1' || isSampleTest) && window.PG_DEMO_ANALYSIS;
      var src = null, isDemo = false;
      if (data.questions && data.question_results) {
        src = data;
        isDemo = isSampleTest;
      }
      else if (demo) { src = window.PG_DEMO_ANALYSIS; isDemo = true; }
      else {
        try {
          var r = await fetch('/api/question-analysis?institute_id=' + encodeURIComponent(instituteId) + '&test_id=' + encodeURIComponent(quizId),
            { headers: { Authorization: 'Bearer ' + (localStorage.getItem('pg_access_token') || '') } });
          if (r.ok) src = await r.json();
        } catch (e) { /* analysis is optional; the leaderboard still renders */ }
      }
      window.PGAnalysis.render(panel, window.PGAnalysis.build(src), { demo: isDemo });
    })();

    if (!list.length) {
      tbody.innerHTML = `
        <tr><td colspan="7" style="padding:3.5rem 1.5rem;text-align:center;color:var(--text-secondary);">
          <i class="ph ph-users" style="font-size:2.2rem;margin-bottom:0.6rem;display:block;opacity:0.5;"></i>
          <strong>No student attempts recorded yet for this test.</strong><br>
          <span style="font-size:0.8rem;opacity:0.8;">Once students take this quiz, performance scorecards will automatically appear here.</span>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(st => {
      let rankBadge = `<span class="rank-pill rank-other">#${st.rank}</span>`;
      if (st.rank === 1) rankBadge = `<span class="rank-pill rank-1"><i class="ph-fill ph-trophy"></i> #1 Rank</span>`;
      else if (st.rank === 2) rankBadge = `<span class="rank-pill rank-2">#2 Rank</span>`;
      else if (st.rank === 3) rankBadge = `<span class="rank-pill rank-3">#3 Rank</span>`;

      const pctClass = st.percentage >= 75 ? 'approved' : (st.percentage >= 40 ? 'draft' : 'failed');
      const submittedDate = st.submitted_at ? new Date(st.submitted_at).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' }) : 'Completed';

      const waLink = buildWhatsAppReportUrl(st, data.quiz_name, tenantName);
      return `
        <tr>
          <td>${rankBadge}</td>
          <td>
            <div style="font-weight:700;color:var(--text-primary);">${escHtml(st.student_name || st.name || 'Anonymous Student')}</div>
            <div style="font-size:0.77rem;color:var(--text-secondary);">${escHtml(st.email || '&mdash;')}${st.phone ? ' &bull; ' + escHtml(st.phone) : ''}</div>
          </td>
          <td style="font-weight:700;color:var(--text-primary);">
            ${st.score} <span style="font-size:0.76rem;font-weight:400;color:var(--text-secondary);">/ ${st.max_score || data.max_score || 120}</span>
          </td>
          <td>
            <span class="status-badge ${pctClass}">${st.percentage}%</span>
          </td>
          <td style="font-size:0.85rem;color:var(--text-secondary);">
            <i class="ph ph-timer"></i> ${st.time_taken_formatted || '&mdash;'}
          </td>
          <td style="font-size:0.82rem;color:var(--text-secondary);">
            ${submittedDate}
          </td>
          <td style="text-align:right;">
            <a href="${escHtml(waLink)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm wa-send-btn" style="background:#25D366;color:#fff;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:0.35rem;font-size:0.8rem;text-decoration:none;font-weight:700;padding:0.4rem 0.8rem;box-shadow:0 2px 6px rgba(37,211,102,0.3);white-space:nowrap;">
              <i class="ph-fill ph-whatsapp-logo" style="font-size:1.05rem;"></i> Send Report
            </a>
          </td>
        </tr>
      `;
    }).join('');

  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:var(--primary);"><i class="ph ph-warning-circle" style="font-size:1.5rem;margin-bottom:0.4rem;display:block;"></i> Failed to load report: ${escHtml(e.message)}</td></tr>`;
  }
}

function refreshActiveReport() {
  if (activeQuizId) {
    selectTest(activeQuizId, activeQuizTitle);
  }
}

if (checkAuth()) {
  loadTestsDirectory();
  // ?demo=1 : show the analysis panel on clearly-marked DEMO data, even when no test can be loaded.
  if (new URLSearchParams(location.search).get('demo') === '1' && window.PG_DEMO_ANALYSIS) {
    var emptyEl = document.getElementById('emptyReportState');
    if (emptyEl) emptyEl.style.display = 'none';
    document.getElementById('resultsContent').style.display = 'block';
    document.getElementById('repQuizTitle').innerHTML = 'DEMO — sample analysis (not real students)';
    window.PGAnalysis.render(document.getElementById('analysisPanel'), window.PGAnalysis.build(window.PG_DEMO_ANALYSIS), { demo: true });
  }
}
</script>
</body>
